<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e8744c" />
  <meta name="description" content="A simple, beautiful cookbook for your favorite recipes." />
  <title>Our Cookbook</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== Top bar ===== -->
  <header class="topbar" id="topbar">
    <button class="icon-btn back-btn" id="backBtn" aria-label="Go back" hidden>
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="brand" id="brand">
      <span class="brand-emoji" aria-hidden="true">🍳</span>
      <span class="brand-text">Our Cookbook</span>
    </h1>
  </header>

  <main id="app" class="app"></main>

  <!-- ===== Floating add button ===== -->
  <button class="fab" id="fab" aria-label="Add a new recipe">
    <svg viewBox="0 0 24 24" width="30" height="30"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span>New Recipe</span>
  </button>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
